# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: rajanalisonadhikari-beep/adhikari-rajan-website-
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c62714d3-6258-412b-8362-69e8c244f747/pkce
  auth_token_endpoint: /sites/c62714d3-6258-412b-8362-69e8c244f747/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://adhikari-rajan.com.np

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Website Content"
    files:
      - label: "Home Page"
        name: "home"
        file: "content.json"
        fields:
          - { label: "Top small heading", name: "hero_eyebrow", widget: "string" }
          - { label: "Big title — line 1", name: "hero_line1", widget: "string" }
          - { label: "Big title — line 2 (gold italic)", name: "hero_line2", widget: "string" }
          - { label: "Big title — line 3", name: "hero_line3", widget: "string" }
          - { label: "Intro sentence under title", name: "hero_desc", widget: "text" }
          - { label: "Our Story — paragraph 1", name: "story_p1", widget: "text" }
          - { label: "Our Story — paragraph 2", name: "story_p2", widget: "text" }
          - { label: "Signature Cut — paragraph 1", name: "signature_p1", widget: "text" }
          - { label: "Signature Cut — paragraph 2", name: "signature_p2", widget: "text" }
          - { label: "Price (e.g. Rs. 100)", name: "price", widget: "string" }
          - { label: "Review 1 — text", name: "testi1_text", widget: "text" }
          - { label: "Review 1 — name", name: "testi1_author", widget: "string" }
          - { label: "Review 2 — text", name: "testi2_text", widget: "text" }
          - { label: "Review 2 — name", name: "testi2_author", widget: "string" }
          - { label: "Phone number", name: "phone", widget: "string" }
          - { label: "Instagram handle (e.g. @razanz_40)", name: "instagram_handle", widget: "string" }
          - { label: "Our Story — main photo", name: "img_story", widget: "image", required: false }
          - { label: "Top floating photo 1", name: "img_float1", widget: "image", required: false }
          - { label: "Top floating photo 2", name: "img_float2", widget: "image", required: false }
          - { label: "Top floating photo 3", name: "img_float3", widget: "image", required: false }
          - { label: "Top floating photo 4", name: "img_float4", widget: "image", required: false }
